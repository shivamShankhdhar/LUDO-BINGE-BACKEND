spring.application.name=ludo-binge-server
spring.config.import=optional:file:./config/database-local.properties
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database Connection (Supports standard Spring env vars, Render, Neon, or local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/ludo_binge}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:ludo_binge}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:local-development-only}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=ludo-binge-postgres
spring.datasource.hikari.schema=${DB_SCHEMA:public}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.ApplicationName=ludo-binge-server
# Server-side bound; keep game transactions short. No network calls inside a transaction.
spring.datasource.hikari.connection-init-sql=SET search_path TO public, ludo_binge; SET statement_timeout = '15s'
spring.transaction.default-timeout=10s

# Flyway configuration
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never

# Google OAuth Client ID
ludo.google.client-id=${GOOGLE_CLIENT_ID:667573150359-adhhbgerfcli282ruv7aejr7n1v8ame4.apps.googleusercontent.com}
ludo.invite.base-url=${INVITE_BASE_URL:}
ludo.media.url=${LIVEKIT_URL:}
ludo.media.api-key=${LIVEKIT_API_KEY:}
ludo.media.api-secret=${LIVEKIT_API_SECRET:}
ludo.public-enabled=${PUBLIC_MATCHMAKING_ENABLED:false}
ludo.region=${LUDO_REGION:in-primary}
ludo.allowed-origins=${LUDO_ALLOWED_ORIGINS:}
ludo.workers.enabled=${LUDO_WORKERS_ENABLED:true}
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
