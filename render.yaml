# Render Blueprint Specification for LUDO-BINGE-BACKEND
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ludo-binge-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-binge-db
          property: connectionString
      - key: LUDO_WORKERS_ENABLED
        value: "true"

databases:
  - name: ludo-binge-db
    databaseName: ludo_binge
    user: ludo_binge
    plan: free
    region: singapore
