services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ludo_binge
      POSTGRES_USER: ludo_binge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludo_binge -d ludo_binge"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
